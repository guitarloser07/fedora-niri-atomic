---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Shared modules for personal and work images.
# Full recipes in personal.yml / work.yml include this via `from-file: common.yml`.
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      copr:
        - yalter/niri
        - ublue-os/packages
        - pvermeer/sunshine
    install:
      packages:
        - niri
        - xorg-x11-server-Xwayland
        - noctalia
        - kitty
        - gdm
        - btop
        - chezmoi
        - fastfetch
        - nautilus
        - ncdu
        - neovim
        - gnome-disk-utility
        - sunshine
        - openconnect
        - NetworkManager-openconnect
        - wireguard-tools
        - yt-dlp
        - testssl
      exclude:
        - fuzzel
        - alacritty
    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)
        - gnome-software
        - waybar
        - fuzzel
        - alacritty

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        remote: flathub # Explicit Flathub bazaar store for easy flatpak additions
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - org.gnome.Loupe
          - org.gnome.Calculator
          - org.gnome.TextEditor
          - org.gnome.Connections
          - io.github.kolunmi.Bazaar
          - com.github.PintaProject.Pinta
          - org.localsend.localsend_app
          - org.onlyoffice.desktopeditors
          - com.moonlight_stream.Moonlight
          - com.github.taiko2k.tauonmb
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
