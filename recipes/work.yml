---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/guitarloser07/fedora-niri-atomic-work
name: fedora-niri-atomic-work
description: A minimal Niri + Noctalia atomic spin built on UBlue base. (Work edition)
base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - from-file: common.yml

  - type: files
    files:
      - source: work-system
        destination: / # work-only system files (v4l2loopback kmod configs)

  - type: dnf
    install:
      packages:
        # Intel IPU7 MIPI camera stack (e.g. Dell Pro 14 Premium PA14250, ov08x40 sensor):
        # - pipewire-plugin-libcamera exposes the camera to portal-aware apps as "Built-in Front Camera"
        # - libcamera-ipa provides the SoftISP pipeline handler backing it
        # - libcamera-tools provides `cam`/`qcam` for diagnostics
        - pipewire-plugin-libcamera
        - libcamera-ipa
        - libcamera-tools
        # GStreamer bridge deps: feed libcamera into the v4l2loopback node
        # for V4L2-only apps (Zoom, Teams). libcamerasrc lives in
        # libcamera-gstreamer, v4l2sink in -good, videoconvert in -base.
        - gstreamer1
        - gstreamer1-plugins-base
        - gstreamer1-plugins-good
        - libcamera-gstreamer

  - type: akmods
    install:
      # Prebuilt from ublue-os/akmods (atomic-safe; no DKMS/RPMFusion at runtime).
      # Provides the /dev/video42 "IPU7-Camera" node (see modprobe.d config).
      - v4l2loopback

  - type: systemd
    user:
      enabled:
        # Always-on bridge: libcamera -> /dev/video42 (see files/systemd/user/).
        - ipu7-bridge.service

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        remote: flathub
        install: # work-only flatpaks
          - com.microsoft.Edge
          - org.apache.directory.studio
          - io.beekeeperstudio.Studio
          - org.onlyoffice.desktopeditors # also in common, listed here to make work intent explicit
          - us.zoom.Zoom
          - com.github.IsmaelMartinez.teams_for_linux
