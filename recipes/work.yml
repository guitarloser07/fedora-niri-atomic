---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/guitarloser07/fedora-niri-atomic-work
name: fedora-niri-atomic-work
description: A minimal Niri + Noctalia atomic spin built on UBlue base. (Work edition)
base-image: ghcr.io/ublue-os/base-main
image-version: latest

modules:
  - from-file: common.yml

  - type: files
    files:
      - source: work-system
        destination: / # work-only system files (v4l2-relayd drop-in config)

  - type: akmods
    install:
      # NOTE: this must run BEFORE the dnf module below. dnf's v4l2-relayd
      # pulls RPMFusion's v4l2loopback, which hard-Requires v4l2loopback-kmod.
      # With this prebuilt kmod already installed, that dep is satisfied;
      # otherwise dnf pulls akmod-v4l2loopback, whose %post tries to compile
      # a kmod inside the build container as root and fails the transaction.
      # Prebuilt from ublue-os/akmods (atomic-safe; no DKMS/RPMFusion at runtime).
      # v4l2-relayd (RPMFusion) Requires: v4l2loopback userspace configs and
      # ships its own modprobe/modules-load for an "Intel MIPI Camera" node;
      # this kmod provides the actual kernel module. The relay finds the node
      # by card label, so no pinned video_nr is needed (avoids colliding with
      # raw IPU nodes /dev/video0-31).
      - v4l2loopback

  - type: dnf
    repos:
      # v4l2-relayd lives in RPMFusion free (not Fedora repos), so enable it
      # explicitly instead of relying on whatever the base image ships.
      nonfree: rpmfusion
    install:
      packages:
        # Intel IPU7 MIPI camera stack (e.g. Dell Pro 14 Premium PA14250, ov08x40 sensor):
        # - pipewire-plugin-libcamera exposes the camera to portal-aware apps as "Built-in Front Camera"
        # - libcamera-ipa provides the SoftISP pipeline handler backing it
        # - libcamera-tools provides `cam`/`qcam` for diagnostics
        - pipewire-plugin-libcamera
        - libcamera-ipa
        - libcamera-tools
        # On-demand V4L2 compat for V4L2-only apps (Zoom, Teams), mirroring
        # Ubuntu 24.04 (v4l2-relayd 0.1.2, VIDEOSRC=icamerasrc, NV12 720p30).
        # Fedora has no icamerasrc/Intel CamHAL blobs, so the relay input is
        # libcamerasrc (SoftISP) via our /etc/v4l2-relayd.d/libcamerasrc.conf.
        # v4l2-relayd comes from RPMFusion free (see repos above);
        # its GStreamer input deps are below: libcamerasrc in libcamera-gstreamer,
        # v4l2sink in -good, videoconvert in -base.
        - v4l2-relayd
        - gstreamer1
        - gstreamer1-plugins-base
        - gstreamer1-plugins-good
        - libcamera-gstreamer

  - type: systemd
    system:
      enabled:
        # On-demand relay target: the generator spawns
        # v4l2-relayd@libcamerasrc.service from our drop-in config. Zero CPU
        # when idle; streams only while a V4L2 app holds the loopback device.
        - v4l2-relayd.service
      masked:
        # RPMFusion ships /etc/v4l2-relayd.d/icamerasrc.conf as a dangling
        # symlink (-> /run/v4l2-relayd). The generator spawns a bogus
        # v4l2-relayd@icamerasrc instance from it that crash-loops
        # (empty device path -> GStreamer NULL-element asserts) until
        # start-limit-hit. We use libcamerasrc, not icamerasrc: mask it.
        - v4l2-relayd@icamerasrc.service

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        remote: flathub
        install: # work-only flatpaks
          - com.microsoft.Edge
          - org.apache.directory.studio
          - io.beekeeperstudio.Studio
          - org.onlyoffice.desktopeditors # also in common, listed here to make work intent explicit
          - us.zoom.Zoom
          - com.github.IsmaelMartinez.teams_for_linux
