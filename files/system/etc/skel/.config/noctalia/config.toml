[theme]
mode    = "dark"
source  = "builtin"
builtin = "Gruvbox"

[bar.main]
position              = "top"
margin_h              = 0
margin_edge           = 0
radius                = 0
concave_edge_corners  = false

[theme.templates]
enable_builtin_templates = true
builtin_ids             = ["kitty", "gtk3", "gtk4", "qt"]

[wallpaper]
enabled   = true
directory = "/usr/share/backgrounds"
fill_mode = "cover"
