[theme]
mode    = "dark"
source  = "builtin"
builtin = "Gruvbox"

[theme.templates]
enable_builtin_templates = true
builtin_ids             = ["kitty", "gtk3", "gtk4"]

[bar.main]
position              = "top"
thickness             = 28
margin_ends           = 0
margin_edge           = 0
radius                = 0
concave_edge_corners  = false
padding               = 8
widget_spacing        = 4
shadow                = false
capsule               = false
background_opacity    = 1.0
font_weight           = 500

start  = ["launcher", "wallpaper", "workspaces"]
center = ["clock"]
end    = ["tray", "network", "volume", "battery"]

[wallpaper]
enabled   = true
directory = "/usr/share/backgrounds"
fill_mode = "cover"
