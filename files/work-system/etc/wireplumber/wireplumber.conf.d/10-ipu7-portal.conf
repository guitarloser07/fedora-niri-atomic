# IPU7 MIPI camera (ov08x40): PipeWire otherwise exposes ~32 raw, unusable
# V4L2 nodes alongside the working libcamera source, cluttering every
# portal camera chooser (e.g. Firefox lists dozens of dead "ipu7" entries).
# Present only the libcamera camera ("Built-in Front Camera") on the portal.
# V4L2-only apps (Zoom) keep using /dev/video42 directly, which bypasses
# PipeWire and is unaffected by this monitor setting.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}
