# libcamera SoftISP (our libcamerasrc backend) needs dma-buf heaps to allocate
# ISP buffers. The packaged v4l2-relayd@.service unit uses DevicePolicy=closed
# with an allow-list written for Intel's icamerasrc HAL (which never touches
# SoftISP), so /dev/dma_heap/* is invisible inside the sandbox and the relay
# logs "Failed to create DmaBufAllocator object ... disabling software
# debayering" — i.e. a black feed. Allow the DMA heaps explicitly.
# (Nonexistent heap nodes are harmless here; rules are just cgroup entries.)
[Service]
DeviceAllow=/dev/dma_heap/system rw
DeviceAllow=/dev/dma_heap/system-uncached rw
DeviceAllow=/dev/dma_heap/reserved rw
DeviceAllow=/dev/dma_heap/cma rw
DeviceAllow=/dev/udmabuf rw
