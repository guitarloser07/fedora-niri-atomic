# Intel IPU7 relay instance (e.g. Dell Pro 14 Premium PA14250, ov08x40).
# Mirrors the working Ubuntu 24.04 setup (v4l2-relayd 0.1.2,
# VIDEOSRC=icamerasrc buffer-count=7, NV12 1280x720@30, "Intel MIPI Camera"),
# except Fedora has no icamerasrc/Intel CamHAL blobs, so the input is
# libcamerasrc via libcamera SoftISP (see libcamera-gstreamer package).
# Single libcamera camera on this hardware, so no camera-name is needed.
#
# The systemd generator creates v4l2-relayd@libcamerasrc.service from this
# file (filename without .conf = instance name). The relay is on-demand:
# zero CPU when idle, streams only while a V4L2 app (Zoom, Teams) holds the
# loopback device open. Portal-aware apps (Firefox, Edge) keep using
# pipewire-plugin-libcamera directly and bypass this relay.
#
# CARD_LABEL must match the v4l2-relayd package modprobe config
# ("Intel MIPI Camera") — the instance finds its /dev/videoN by label grep,
# so no pinned video_nr is needed and raw IPU nodes (/dev/video0-31) are safe.
# Colors use the generic SoftISP tuning (no ov08x40.yaml upstream yet), so
# expect slightly flatter/grainier output than Ubuntu's Intel HAL for now.
VIDEOSRC="libcamerasrc"
FORMAT=NV12
WIDTH=1280
HEIGHT=720
FRAMERATE=30/1
CARD_LABEL="Intel MIPI Camera"
